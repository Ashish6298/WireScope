name: Continuous Integration

on:
  push:
    branches: [ main, ashish ]
  pull_request:
    branches: [ main, ashish ]

permissions:
  contents: read

jobs:
  lint_and_format:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Check Source Code Formatting
        run: zig fmt --check src build.zig poc

  build_and_test:
    name: Test Matrix (${{ matrix.os }})
    needs: lint_and_format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup macOS Developer Tools
        if: runner.os == 'macOS'
        run: |
          if [ -d "/Library/Developer/CommandLineTools" ]; then
            sudo xcode-select -s /Library/Developer/CommandLineTools
          elif [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          DEV_DIR=$(xcode-select -p 2>/dev/null || echo "")
          if [ -n "$DEV_DIR" ]; then
            echo "DEVELOPER_DIR=${DEV_DIR}" >> $GITHUB_ENV
          fi
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || xcrun --show-sdk-path 2>/dev/null || echo "")
          if [ -n "$SDK_PATH" ]; then
            echo "SDKROOT=${SDK_PATH}" >> $GITHUB_ENV
          fi
          rm -rf ~/.cache/zig .zig-cache zig-cache

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Patch macOS SDK libSystem.tbd for Zig 0.13.0
        if: runner.os == 'macOS'
        run: |
          ZIG_BIN="$(which zig)"
          ZIG_DIR="$(dirname "$ZIG_BIN")"
          ZIG_TBD="$(find "$ZIG_DIR" -name "libSystem.tbd" 2>/dev/null | head -n 1)"
          if [ -z "$ZIG_TBD" ]; then
            ZIG_TBD="$(find /Users/runner -name "libSystem.tbd" 2>/dev/null | grep "/darwin/" | head -n 1)"
          fi
          echo "Found Zig libSystem.tbd at: $ZIG_TBD"
          for sdk in $(xcrun --sdk macosx --show-sdk-path 2>/dev/null) /Library/Developer/CommandLineTools/SDKs/MacOSX*.sdk /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX*.sdk; do
            if [ -d "$sdk/usr/lib" ] && [ -n "$ZIG_TBD" ] && [ -f "$ZIG_TBD" ]; then
              echo "Patching $sdk/usr/lib/libSystem.tbd"
              sudo cp -f "$ZIG_TBD" "$sdk/usr/lib/libSystem.tbd"
              sudo cp -f "$ZIG_TBD" "$sdk/usr/lib/libSystem.B.tbd"
            fi
          done
          rm -rf ~/.cache/zig .zig-cache zig-cache

      - name: Clear corrupted Zig cache (macOS fix)
        if: runner.os == 'macOS'
        run: rm -rf ~/.cache/zig zig-cache

      - name: Build Library and CLI
        run: zig build

      - name: Execute Full Test Suite
        run: zig build test --summary all

      - name: Run CLI Smoke Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .\zig-out\bin\wirescope.exe --help
          .\zig-out\bin\wirescope.exe version
          .\zig-out\bin\wirescope.exe capabilities --format json
          .\zig-out\bin\wirescope.exe lab list
          .\zig-out\bin\wirescope.exe lab run dns_failure
          powershell.exe -File examples/automation/verify_safety_gate.ps1 -WirescopeBin .\zig-out\bin\wirescope.exe
          powershell.exe -File examples/automation/check_local_policy.ps1 -WirescopeBin .\zig-out\bin\wirescope.exe

      - name: Run CLI Smoke Tests (POSIX)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./zig-out/bin/wirescope
          ./zig-out/bin/wirescope --help
          ./zig-out/bin/wirescope version
          ./zig-out/bin/wirescope capabilities --format json
          ./zig-out/bin/wirescope lab list
          ./zig-out/bin/wirescope lab run dns_failure
          export PATH="$(pwd)/zig-out/bin:$PATH"
          export WIRESCOPE_BIN="$(pwd)/zig-out/bin/wirescope"
          bash examples/automation/verify_safety_gate.sh "$WIRESCOPE_BIN"
          bash examples/automation/check_local_policy.sh "$WIRESCOPE_BIN"


  cross_compilation_verification:
    name: Cross-Compilation Feasibility
    needs: lint_and_format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Cross-compile Linux x86_64
        run: zig build -Dtarget=x86_64-linux

      - name: Cross-compile Linux ARM64
        run: zig build -Dtarget=aarch64-linux

      - name: Cross-compile Windows x86_64
        run: zig build -Dtarget=x86_64-windows

      - name: Cross-compile macOS x86_64
        run: zig build -Dtarget=x86_64-macos

      - name: Cross-compile macOS ARM64
        run: zig build -Dtarget=aarch64-macos
